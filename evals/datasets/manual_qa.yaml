  - {id: vog-res-08, split: reserved, manual_id: voge-500ds-en-unknown-edition, question: "How old is this manual edition?", expected_behavior: not_found, expected: "Edition and model year are unknown.", evidence_pages: [], required_terms: [], category: identity, review_status: human_checked}
