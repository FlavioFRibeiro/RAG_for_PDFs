  - {id: vog-res-03, split: reserved, manual_id: voge-500ds-en-unknown-edition, question: "What chain slack does the Ténéré 700 use?", expected_behavior: needs_clarification, expected: "Request switching to the Yamaha manual.", evidence_pages: [], required_terms: [], category: wrong_motorcycle, review_status: human_checked}
  - {id: vog-res-04, split: reserved, manual_id: voge-500ds-en-unknown-edition, question: "Compare its tire pressure with the Ténéré 700.", expected_behavior: needs_clarification, expected: "Comparison is outside scope and requires changing selection.", evidence_pages: [], required_terms: [], category: isolation, review_status: human_checked}
  - {id: vog-res-05, split: reserved, manual_id: voge-500ds-en-unknown-edition, question: "What is the heated-grip power rating?", expected_behavior: not_found, expected: "Cannot confirm this in the selected manual.", evidence_pages: [], required_terms: [], category: absent, review_status: human_checked}
