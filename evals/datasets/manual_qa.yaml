  - {id: vog-res-01, split: reserved, manual_id: voge-500ds-en-unknown-edition, question: "What is the engine oil capacity?", expected_behavior: needs_clarification, expected: "Clarify whether parameter-table capacity (3.2 L) or replacement fill volume (2.7 L) is requested.", evidence_pages: [55, 72], required_terms: [], category: ambiguity, review_status: human_checked}
